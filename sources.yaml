        type: newsletter
        url: https://subtextbyzerodha.substack.com
        about: Long-form writing that makes finance, economics and markets less boring.
        feed: https://subtextbyzerodha.substack.com/feed
        status: active   # latest 11 Oct 2026
      - name: Zerodha Subtext
        type: youtube
        url: https://www.youtube.com/@SubtextbyZerodha
        about: Video explainers on why things in finance are happening.
        channel_id: UC-yQGXgvEnjg0bCBMtrYxPg
