# Inventory of Zerodha content properties.
# Verified 2026-10-15 by fetching each feed / channel page directly.
# This file becomes the site's source config: initiatives -> properties -> feeds.
# status: active (published in last ~30 days) | dormant | unverified
# about: plain factual description, drawn from each publication's own copy. Shown on the
#        initiative pages and in llms.txt, so keep it accurate and free of marketing.

initiatives:
  - id: markets
    name: Markets by Zerodha
    short: Markets        # label in the colour key
    blurb: Daily explainers on the biggest stories in Indian markets and the global economy.
    about: >-
      Markets by Zerodha explains what is happening in markets, business and the economy in plain
      English. Its flagship is The Daily Brief, a daily newsletter, podcast and YouTube show on the
      biggest stories in Indian and global markets, also published in Hindi. The same team writes
      The Chatter, on what India's biggest companies are saying, and the Aftermarket Report, a short
      daily wrap of the markets.
    properties:
      - name: The Daily Brief
        type: newsletter
        url: https://thedailybrief.zerodha.com
        about: The biggest stories in Indian markets and the global business landscape, every weekday.
        feed: https://thedailybrief.zerodha.com/feed
        status: active   # latest post 15 Oct 2026
        sections:        # Substack sections; posts carry these as tags
          - { name: "Beyond the Charts", slug: beyond-the-charts }
          - { name: "Who Said What?", slug: who-said-what }
          - { name: "The World, Simplified", slug: the-world-simplified }
          - { name: "What Does That Mean?", slug: what-does-that-mean }
          - { name: "Investing in India", slug: investing-in-india }
          - { name: "Inside Markets by Zerodha", slug: inside-markets-by-zerodha }
      - name: The Chatter
        type: newsletter
        url: https://thechatter.zerodha.com
        about: What India's biggest companies are saying, from earnings calls and beyond.
        feed: https://thechatter.zerodha.com/feed
        status: active   # latest 14 Oct 2026
        sections:
          - { name: "Plotlines", slug: plotlines }
          - { name: "Points & Figures", slug: points-and-figures }
      - name: Aftermarket Report
        type: newsletter
        url: https://aftermarketreport.zerodha.com
        about: A quick daily rundown of what happened in the Indian markets.
        feed: https://aftermarketreport.zerodha.com/feed
        status: active   # latest 14 Oct 2026
      - name: What the hell is happening?
        type: newsletter
        url: https://whatthehellishappening.substack.com
        about: Curated reading for making sense of fast-moving world events.
        feed: https://whatthehellishappening.substack.com/feed
        status: dormant  # latest 1 Nov 2025
      - name: Markets by Zerodha
        type: youtube
        url: https://www.youtube.com/@marketsbyzerodha
        about: The Daily Brief and other shows on markets, business and the economy.
        channel_id: UCXbKJML9pVclFHLFzpvBgWw
        status: active   # 251K subs
      - name: Markets by Zerodha Hindi
        type: youtube
        url: https://www.youtube.com/@marketsbyzerodhahindi
        about: One big story from the markets or the economy, every day, in Hindi.
        channel_id: UCorKX0CAjQh0SnflWPnnI9w
        status: active   # 210K subs
      - name: Markets by Zerodha Kannada
        type: youtube
        url: https://www.youtube.com/@marketsbyzerodhakannada
        about: Business and finance news in Kannada.
        channel_id: UCdfeEGP3gM_7ZL5wbkDZKdg
        status: dormant  # last upload ~1 year ago
      - name: "@zerodhamarkets"
        type: x
        url: https://x.com/zerodhamarkets
        about: Markets by Zerodha on X.
        status: active

  - id: subtext
