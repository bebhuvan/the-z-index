name: Fetch feeds and deploy

on:
  schedule:
    # Twice a day, 8:00 am and 9:00 pm IST. Cron is in UTC (IST = UTC+5:30). GitHub can start
    # scheduled runs late, often 10 to 30 minutes, when its runners are busy.
    - cron: '30 2,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit the growing archive back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch feeds
        env:
          FEED_PROXY: ${{ vars.FEED_PROXY }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fetch.mjs

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/items.json; then
            echo "No new items"
          else
            git commit -m "Update feed archive"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
